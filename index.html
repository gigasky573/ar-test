<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">

  <style>
    .ar-link {
      display: flex;
      justify-content: center;
      width: fit-content;
      margin: 0 auto;
    }

    .ar-button {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      padding: 12px 24px;
      border: 0;
      border-radius: 8px;
      background: #1769e0;
      color: #fff;
      font: inherit;
      font-weight: 600;
      white-space: nowrap;
      cursor: pointer;
      box-shadow: 0 2px 8px #0003;
    }

    .ar-button:hover {
      background: #1254b5;
    }

    .ar-button:focus-visible {
      outline: 3px solid #111;
      outline-offset: 3px;
    }
  </style>

  <script type="module"
    src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.1.0/model-viewer.min.js">
  </script>
</head>
<body>

  <model-viewer
    src="./models/object.glb"
    ios-src="./models/object.usdz"
    alt="3D 模型"
    ar
    autoplay
    ar-modes="webxr scene-viewer quick-look"
    camera-controls
    auto-rotate
    shadow-intensity="1"
    ar-scale="auto"
    style="width:100%; height:500px;">
    <button type="button" slot="ar-button" class="ar-button">
      開啟 AR 模式
    </button>
  </model-viewer>
<a class="ar-link" href="./models/mint.usdz" rel="ar">
    <img src="./thumbnail.jpg" alt="View in AR">
</a>
</body>
</html>
